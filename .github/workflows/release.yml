name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.25.3)'
        required: false
        default: 'branch-build'
      source_ref:
        description: 'Git ref/branch to build (for example feat_fastopt or feat/apitable-fusion-db)'
        required: false
        default: 'feat_fastopt'

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
            variant: standard
            dockerfile: Dockerfile
            image: docmost/docmost
            artifact_prefix: docmost
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            variant: standard
            dockerfile: Dockerfile
            image: docmost/docmost
            artifact_prefix: docmost
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
            variant: aio
            dockerfile: docker/aio/Dockerfile
            image: docmost/docmost-aio
            artifact_prefix: docmost-aio
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            variant: aio
            dockerfile: docker/aio/Dockerfile
            image: docmost/docmost-aio
            artifact_prefix: docmost-aio
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          ref_slug=$(echo "${SOURCE_REF}" | tr '/:@' '-' | tr -cd '[:alnum:]._-')
          echo "ref_slug=${ref_slug:-manual}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
            ${{ matrix.image }}:${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}
          outputs: type=docker,dest=${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.suffix }},mode=max

      - name: Compress image
        run: gzip ${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.variant }}-${{ matrix.suffix }}
          path: ${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image archives
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          path: /tmp/images
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: /tmp/images/*.docker.tar.gz
          draft: true

      - name: Upload AIO image archives to upload URL
        continue-on-error: true
        shell: bash
        env:
          UPLOAD_AIO_AMD64_TO_URL: ${{ vars.UPLOAD_AIO_AMD64_TO_URL || secrets.UPLOAD_AIO_AMD64_TO_URL }}
          UPLOAD_AIO_ARM64_TO_URL: ${{ vars.UPLOAD_AIO_ARM64_TO_URL || secrets.UPLOAD_AIO_ARM64_TO_URL }}
          AIO_UPLOAD_URL: ${{ vars.AIO_UPLOAD_URL || secrets.AIO_UPLOAD_URL }}
          AIO_UPLOAD_EXPIRE_SECONDS: ${{ vars.AIO_UPLOAD_EXPIRE_SECONDS || secrets.AIO_UPLOAD_EXPIRE_SECONDS }}
        run: |
          set -u

          enabled() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          if ! enabled "${UPLOAD_AIO_AMD64_TO_URL:-}" && ! enabled "${UPLOAD_AIO_ARM64_TO_URL:-}"; then
            echo 'AIO upload URL is disabled for both amd64 and arm64.'
            exit 0
          fi

          if [ -z "${AIO_UPLOAD_URL:-}" ]; then
            echo '::warning::Skipping AIO upload because AIO_UPLOAD_URL is not configured.'
            exit 1
          fi

          expire_seconds="${AIO_UPLOAD_EXPIRE_SECONDS:-2592000}"

          failures=0
          upload_arch() {
            local arch="$1"
            local flag="$2"

            if ! enabled "$flag"; then
              echo "Skipping AIO $arch upload URL."
              return 0
            fi

            shopt -s nullglob
            local files=(/tmp/images/docmost-aio-*-"$arch".docker.tar.gz)
            shopt -u nullglob

            if [ "${#files[@]}" -ne 1 ]; then
              echo "::warning::Expected one AIO $arch image archive, found ${#files[@]}."
              return 1
            fi

            local file="${files[0]}"
            local response_path="$RUNNER_TEMP/aio-upload-$arch-response.json"
            echo "Uploading $(basename "$file") to configured upload URL."

            if ! status_code="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --request POST \
                --output "$response_path" \
                --write-out '%{http_code}' \
                "$AIO_UPLOAD_URL" \
                --form "file=@$file;filename=$(basename "$file");type=application/gzip" \
                --form-string 'anonymous=1' \
                --form-string "expire_in_seconds=$expire_seconds"
            )"; then
              echo "::warning::AIO $arch upload failed."
              if [ -s "$response_path" ]; then
                cat "$response_path"
              fi
              return 1
            fi
            echo "AIO $arch upload completed with HTTP $status_code."
          }

          upload_arch amd64 "${UPLOAD_AIO_AMD64_TO_URL:-}" || failures=$((failures + 1))
          upload_arch arm64 "${UPLOAD_AIO_ARM64_TO_URL:-}" || failures=$((failures + 1))

          if [ "$failures" -gt 0 ]; then
            echo "::warning::AIO upload URL step completed with $failures failure(s)."
            exit 1
          fi

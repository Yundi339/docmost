name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.25.3). Leave empty for branch-build on manual runs."
        required: false
      source_ref:
        description: "Git ref/branch to build. Leave empty to use the selected workflow branch."
        required: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || 'branch-build' }}
  SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
            variant: standard
            dockerfile: Dockerfile
            image: docmost/docmost
            artifact_prefix: docmost
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            variant: standard
            dockerfile: Dockerfile
            image: docmost/docmost
            artifact_prefix: docmost
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
            variant: aio
            dockerfile: docker/aio/Dockerfile
            image: docmost/docmost-aio
            artifact_prefix: docmost-aio
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
            variant: aio
            dockerfile: docker/aio/Dockerfile
            image: docmost/docmost-aio
            artifact_prefix: docmost-aio
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate workspace version
        run: node scripts/check-package-versions.mjs

      - name: Build metadata
        id: metadata
        shell: bash
        run: |
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          ref_slug=$(echo "${SOURCE_REF}" | tr '/:@' '-' | tr -cd '[:alnum:]._-')
          echo "ref_slug=${ref_slug:-manual}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.metadata.outputs.version }}
            ${{ matrix.image }}:${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
          outputs: type=docker,dest=${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.suffix }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.suffix }},mode=max

      - name: Compress image
        run: gzip ${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar

      - name: Upload image archive
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.variant }}-${{ matrix.suffix }}
          path: ${{ matrix.artifact_prefix }}-${{ steps.metadata.outputs.version }}-${{ steps.metadata.outputs.ref_slug }}-${{ steps.metadata.outputs.sha_short }}-${{ matrix.suffix }}.docker.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image archives
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          path: /tmp/images
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: /tmp/images/*.docker.tar.gz
          draft: true
